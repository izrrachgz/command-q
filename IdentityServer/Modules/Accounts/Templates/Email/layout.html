<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{preheader}}</title>
</head>
<body style="margin:0;background:#f1f5f9;color:#0f172a;font-family:Roboto,Arial,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f5f9;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.08);">
          <tr>
            <td style="background:#0f172a;padding:22px 28px;color:#ffffff;font-size:20px;font-weight:700;letter-spacing:.2px;">
              <span style="display:inline-block;margin-right:10px;border-radius:8px;background:#ff0033;padding:6px 9px;font-size:14px;">CQ</span>
              command-q
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px;">
              {{content}}
            </td>
          </tr>
          <tr>
            <td style="border-top:1px solid #e2e8f0;background:#f8fafc;padding:20px 28px;color:#64748b;font-size:12px;line-height:18px;">
              {{footer}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
