<!doctype html>
<html lang="{{DocumentLanguage}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{Title}}</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f5f9; color: #0f172a; }
    main { width: min(100% - 2rem, 28rem); }
    section { border: 1px solid #e2e8f0; border-radius: .5rem; background: #fff; padding: 1.5rem; box-shadow: 0 1px 2px rgba(15, 23, 42, .08); }
    h1 { margin: 0; font-size: 1.5rem; line-height: 2rem; }
    p { color: #475569; line-height: 1.5rem; }
    label { display: block; margin-top: 1rem; font-size: .875rem; font-weight: 600; color: #334155; }
    input[type="text"], input[type="password"] { box-sizing: border-box; width: 100%; min-height: 2.75rem; margin-top: .375rem; border: 1px solid #cbd5e1; border-radius: .375rem; padding: 0 .75rem; font: inherit; }
    input[type="checkbox"] { width: 1rem; height: 1rem; margin: 0; accent-color: #0f766e; }
    .check { display: flex; align-items: center; gap: .5rem; font-weight: 500; }
    button { width: 100%; min-height: 2.75rem; margin-top: 1.25rem; border: 0; border-radius: .375rem; background: #0f766e; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #115e59; }
    .forgot { display: block; margin-top: .75rem; color: #0f766e; font-size: .875rem; font-weight: 600; text-align: right; text-decoration: none; }
    .forgot:hover { color: #115e59; text-decoration: underline; }
    .brand { display: inline-flex; align-items: center; gap: .5rem; margin-bottom: 1.25rem; font-weight: 700; }
    .mark { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: .375rem; background: #020617; color: #fff; }
    .alert { border: 1px solid #fecaca; border-radius: .375rem; background: #fef2f2; color: #b91c1c; padding: .75rem; font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="brand"><span class="mark">{{BrandMark}}</span> {{BrandName}}</div>
      <h1>{{Heading}}</h1>
      <p>{{Intro}}</p>
      {{AlertMarkup}}
      <form method="post" action="{{SignInAction}}">
        <label for="usernameOrEmail">{{UsernameOrEmailLabel}}</label>
        <input id="usernameOrEmail" name="usernameOrEmail" type="text" autocomplete="username" maxlength="255" required>

        <label for="password">{{PasswordLabel}}</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="255" required>

        <a class="forgot" href="{{ForgotPasswordUrl}}">{{ForgotPasswordLabel}}</a>

        <label class="check">
          <input name="rememberMe" type="checkbox" value="true">
          {{RememberMeLabel}}
        </label>

        <button type="submit">{{SubmitButton}}</button>
      </form>
    </section>
  </main>
</body>
</html>
