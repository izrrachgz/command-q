<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Contended and clean benchmark throughput comparison</title>
  <desc id="desc">The first panel compares contended and clean requests per second side by side. The second panel shows clean-run percentage improvements for comparable workloads.</desc>
  <rect width="1000" height="1000" rx="18" fill="#111318"/>
  <text x="40" y="48" fill="#f4f7fb" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Contended versus clean throughput</text>
  <text x="40" y="76" fill="#9aa7b7" font-family="Segoe UI, sans-serif" font-size="14">Same workload and concurrency • completed business operations per second</text>
  <g font-family="Segoe UI, sans-serif" font-size="12">
    <rect x="285" y="92" width="22" height="10" rx="3" fill="#596270"/><text x="317" y="102" fill="#aeb9c8">Contended</text>
    <rect x="410" y="92" width="22" height="10" rx="3" fill="#58d6ff"/><text x="442" y="102" fill="#aeb9c8">Clean</text>
  </g>
  <g stroke="#343a46" stroke-width="1">
    <line x1="285" y1="115" x2="285" y2="478"/><line x1="408" y1="115" x2="408" y2="478"/>
    <line x1="531" y1="115" x2="531" y2="478"/><line x1="654" y1="115" x2="654" y2="478"/>
    <line x1="777" y1="115" x2="777" y2="478"/><line x1="900" y1="115" x2="900" y2="478"/>
  </g>
  <g fill="#8d99a8" font-family="Segoe UI, sans-serif" font-size="11">
    <text x="285" y="497" text-anchor="middle">0</text><text x="408" y="497" text-anchor="middle">1k</text>
    <text x="531" y="497" text-anchor="middle">2k</text><text x="654" y="497" text-anchor="middle">3k</text>
    <text x="777" y="497" text-anchor="middle">4k</text><text x="900" y="497" text-anchor="middle">5k RPS</text>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="13">
    <text x="265" y="138" text-anchor="end" fill="#d7dee8">API · 50</text><rect x="285" y="124" width="328" height="10" rx="3" fill="#596270"/><rect x="285" y="138" width="433" height="10" rx="3" fill="#58d6ff"/><text x="620" y="133" fill="#aeb9c8" font-size="10">2,663</text><text x="725" y="147" fill="#f4f7fb" font-size="10">3,520</text>
    <text x="265" y="181" text-anchor="end" fill="#d7dee8">API · 100</text><rect x="285" y="167" width="313" height="10" rx="3" fill="#596270"/><rect x="285" y="181" width="451" height="10" rx="3" fill="#58d6ff"/><text x="605" y="176" fill="#aeb9c8" font-size="10">2,542</text><text x="743" y="190" fill="#f4f7fb" font-size="10">3,670</text>
    <text x="265" y="224" text-anchor="end" fill="#d7dee8">Jobs · 50</text><rect x="285" y="210" width="327" height="10" rx="3" fill="#596270"/><rect x="285" y="224" width="528" height="10" rx="3" fill="#5ee6a8"/><text x="619" y="219" fill="#aeb9c8" font-size="10">2,660</text><text x="820" y="233" fill="#f4f7fb" font-size="10">4,295</text>
    <text x="265" y="267" text-anchor="end" fill="#d7dee8">Jobs · 200</text><rect x="285" y="253" width="409" height="10" rx="3" fill="#596270"/><rect x="285" y="267" width="541" height="10" rx="3" fill="#5ee6a8"/><text x="701" y="262" fill="#aeb9c8" font-size="10">3,328</text><text x="833" y="276" fill="#f4f7fb" font-size="10">4,398</text>
    <text x="265" y="310" text-anchor="end" fill="#d7dee8">Jobs · 500</text><rect x="285" y="296" width="409" height="10" rx="3" fill="#596270"/><rect x="285" y="310" width="538" height="10" rx="3" fill="#5ee6a8"/><text x="701" y="305" fill="#aeb9c8" font-size="10">3,321</text><text x="830" y="319" fill="#f4f7fb" font-size="10">4,371</text>
    <text x="265" y="353" text-anchor="end" fill="#d7dee8">Email protobuf · 50</text><rect x="285" y="339" width="286" height="10" rx="3" fill="#596270"/><rect x="285" y="353" width="407" height="10" rx="3" fill="#e96a9a"/><text x="578" y="348" fill="#aeb9c8" font-size="10">2,328</text><text x="699" y="362" fill="#f4f7fb" font-size="10">3,305</text>
    <text x="265" y="396" text-anchor="end" fill="#d7dee8">Identity sign-in · 20</text><rect x="285" y="382" width="25" height="10" rx="3" fill="#596270"/><rect x="285" y="396" width="31" height="10" rx="3" fill="#a98cff"/><text x="317" y="391" fill="#aeb9c8" font-size="10">205</text><text x="323" y="405" fill="#f4f7fb" font-size="10">254</text>
    <text x="265" y="439" text-anchor="end" fill="#d7dee8">Identity sign-in · 40</text><rect x="285" y="425" width="29" height="10" rx="3" fill="#596270"/><rect x="285" y="439" width="36" height="10" rx="3" fill="#a98cff"/><text x="321" y="434" fill="#aeb9c8" font-size="10">232</text><text x="328" y="448" fill="#f4f7fb" font-size="10">292</text>
  </g>
  <text x="40" y="548" fill="#f4f7fb" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Clean rerun improvement over contended baseline</text>
  <text x="40" y="576" fill="#9aa7b7" font-family="Segoe UI, sans-serif" font-size="14">Throughput change at the same concurrency • percentage points are not latency changes</text>
  <g transform="translate(0 500)">
  <g stroke="#343a46" stroke-width="1">
    <line x1="285" y1="98" x2="285" y2="440"/><line x1="470" y1="98" x2="470" y2="440"/>
    <line x1="655" y1="98" x2="655" y2="440"/><line x1="840" y1="98" x2="840" y2="440"/>
  </g>
  <g fill="#8d99a8" font-family="Segoe UI, sans-serif" font-size="12">
    <text x="285" y="465" text-anchor="middle">0%</text><text x="470" y="465" text-anchor="middle">20%</text>
    <text x="655" y="465" text-anchor="middle">40%</text><text x="840" y="465" text-anchor="middle">60%</text>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="14">
    <text x="265" y="126" text-anchor="end" fill="#d7dee8">API · 50</text><rect x="285" y="108" width="298" height="24" rx="6" fill="#58d6ff"/><text x="595" y="126" fill="#f4f7fb" font-weight="700">+32.2%</text>
    <text x="265" y="172" text-anchor="end" fill="#d7dee8">API · 100</text><rect x="285" y="154" width="411" height="24" rx="6" fill="#58d6ff"/><text x="708" y="172" fill="#f4f7fb" font-weight="700">+44.4%</text>
    <text x="265" y="218" text-anchor="end" fill="#d7dee8">Jobs · 50</text><rect x="285" y="200" width="569" height="24" rx="6" fill="#5ee6a8"/><text x="866" y="218" fill="#f4f7fb" font-weight="700">+61.5%</text>
    <text x="265" y="264" text-anchor="end" fill="#d7dee8">Jobs · 200</text><rect x="285" y="246" width="297" height="24" rx="6" fill="#5ee6a8"/><text x="594" y="264" fill="#f4f7fb" font-weight="700">+32.1%</text>
    <text x="265" y="310" text-anchor="end" fill="#d7dee8">Jobs · 500</text><rect x="285" y="292" width="292" height="24" rx="6" fill="#5ee6a8"/><text x="589" y="310" fill="#f4f7fb" font-weight="700">+31.6%</text>
    <text x="265" y="356" text-anchor="end" fill="#d7dee8">Email protobuf · 50</text><rect x="285" y="338" width="389" height="24" rx="6" fill="#e96a9a"/><text x="686" y="356" fill="#f4f7fb" font-weight="700">+42.0%</text>
    <text x="265" y="402" text-anchor="end" fill="#d7dee8">Identity sign-in · 20</text><rect x="285" y="384" width="218" height="24" rx="6" fill="#a98cff"/><text x="515" y="402" fill="#f4f7fb" font-weight="700">+23.6%</text>
    <text x="265" y="438" text-anchor="end" fill="#d7dee8">Identity sign-in · 40</text><rect x="285" y="420" width="239" height="24" rx="6" fill="#a98cff"/><text x="536" y="438" fill="#f4f7fb" font-weight="700">+25.8%</text>
  </g>
  </g>
</svg>
