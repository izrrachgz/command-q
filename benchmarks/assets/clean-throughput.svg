<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Clean-run throughput</title>
  <desc id="desc">Horizontal bars show representative throughput: API 3670, Jobs 4398, Email REST 1820, Email protobuf 3305, and IdentityServer sign-in 254 requests per second.</desc>
  <rect width="1000" height="450" rx="18" fill="#111318"/>
  <text x="40" y="48" fill="#f4f7fb" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Clean rerun: representative throughput</text>
  <text x="40" y="76" fill="#9aa7b7" font-family="Segoe UI, sans-serif" font-size="14">Completed business operations per second • higher is better</text>
  <g stroke="#343a46" stroke-width="1">
    <line x1="270" y1="98" x2="270" y2="382"/><line x1="415" y1="98" x2="415" y2="382"/>
    <line x1="560" y1="98" x2="560" y2="382"/><line x1="705" y1="98" x2="705" y2="382"/><line x1="850" y1="98" x2="850" y2="382"/>
  </g>
  <g fill="#8d99a8" font-family="Segoe UI, sans-serif" font-size="12">
    <text x="270" y="405" text-anchor="middle">0</text><text x="415" y="405" text-anchor="middle">1,000</text>
    <text x="560" y="405" text-anchor="middle">2,000</text><text x="705" y="405" text-anchor="middle">3,000</text>
    <text x="850" y="405" text-anchor="middle">4,000 RPS</text>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="15">
    <text x="250" y="136" text-anchor="end" fill="#d7dee8">API · 100 clients</text>
    <rect x="270" y="116" width="532" height="27" rx="6" fill="#58d6ff"/><text x="814" y="136" fill="#f4f7fb" font-weight="700">3,670</text>
    <text x="250" y="191" text-anchor="end" fill="#d7dee8">Jobs · 200 clients</text>
    <rect x="270" y="171" width="638" height="27" rx="6" fill="#5ee6a8"/><text x="920" y="191" fill="#f4f7fb" font-weight="700">4,398</text>
    <text x="250" y="246" text-anchor="end" fill="#d7dee8">Email REST · 50 clients</text>
    <rect x="270" y="226" width="264" height="27" rx="6" fill="#f7b955"/><text x="546" y="246" fill="#f4f7fb" font-weight="700">1,820</text>
    <text x="250" y="301" text-anchor="end" fill="#d7dee8">Email protobuf · 50 clients</text>
    <rect x="270" y="281" width="479" height="27" rx="6" fill="#e96a9a"/><text x="761" y="301" fill="#f4f7fb" font-weight="700">3,305</text>
    <text x="250" y="356" text-anchor="end" fill="#d7dee8">Identity sign-in · 20 clients</text>
    <rect x="270" y="336" width="37" height="27" rx="6" fill="#a98cff"/><text x="319" y="356" fill="#f4f7fb" font-weight="700">254</text>
  </g>
  <text x="40" y="432" fill="#788597" font-family="Segoe UI, sans-serif" font-size="12">Clean local baseline; use the detailed tables for latency, errors, resources, and saturation boundaries.</text>
</svg>
