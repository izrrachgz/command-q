name: Package quality and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: command-q

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: command-q/global.json

      - name: Build and verify packages
        working-directory: command-q
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -LockedMode -Audit

      - name: Test
        working-directory: command-q
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -NoBuild

      - name: Inventory vulnerable dependencies
        working-directory: command-q
        run: dotnet list ./command-q.sln package --vulnerable --include-transitive --no-restore
