name: Package quality and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: command-q

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: command-q/global.json

      - name: Build and verify packages
        working-directory: command-q
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -LockedMode -Audit

      - name: Test
        working-directory: command-q
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -NoBuild

      - name: Inventory vulnerable dependencies
        working-directory: command-q
        run: dotnet list ./command-q.sln package --vulnerable --include-transitive --no-restore
