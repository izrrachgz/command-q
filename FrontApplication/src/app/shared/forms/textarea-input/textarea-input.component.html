    <label [attr.for]="inputId" class="block text-sm font-medium text-slate-700">{{ label }}</label>
    <textarea
      [id]="inputId"
      [value]="value"
      [rows]="rows"
      [attr.placeholder]="placeholder || null"
      [attr.maxlength]="maxLength ?? null"
      [disabled]="disabled"
      (input)="handleInput($event)"
      (blur)="markTouched()"
      class="mt-1 block w-full resize-y rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-950 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-teal-600 focus:ring-2 focus:ring-teal-100 disabled:cursor-not-allowed disabled:text-slate-500"
    ></textarea>
    <app-validation-message [errors]="ngControl?.control?.errors" [show]="showErrors" />
