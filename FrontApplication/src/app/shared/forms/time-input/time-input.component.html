    <label [attr.for]="inputId" class="block text-sm font-medium text-slate-700">{{ label }}</label>
    <input
      [id]="inputId"
      type="time"
      [value]="value"
      [attr.min]="min || null"
      [attr.max]="max || null"
      [disabled]="disabled"
      (input)="handleInput($event)"
      (blur)="markTouched()"
      class="mt-1 block min-h-11 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-950 shadow-sm outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-100 disabled:cursor-not-allowed disabled:text-slate-500"
    />
    <app-validation-message [errors]="ngControl?.control?.errors" [show]="showErrors" />
