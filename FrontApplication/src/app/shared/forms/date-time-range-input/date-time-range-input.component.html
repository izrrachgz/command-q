<fieldset>
  @if (label) {
    <legend class="block text-sm font-medium text-slate-700">{{ label }}</legend>
  }

  <div class="mt-1 grid gap-3 md:grid-cols-2">
    <div>
      <label [attr.for]="startInputId" class="block text-xs font-medium uppercase tracking-wide text-slate-500">
        {{ startLabel }}
      </label>
      <input
        [id]="startInputId"
        type="datetime-local"
        [value]="value.start"
        [attr.min]="min || null"
        [attr.max]="max || null"
        [attr.aria-invalid]="showErrors ? 'true' : null"
        [disabled]="disabled"
        (input)="handleInput('start', $event)"
        (blur)="markTouched()"
        class="mt-1 block min-h-11 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-950 shadow-sm outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-100 disabled:cursor-not-allowed disabled:text-slate-500"
      />
    </div>

    <div>
      <label [attr.for]="endInputId" class="block text-xs font-medium uppercase tracking-wide text-slate-500">
        {{ endLabel }}
      </label>
      <input
        [id]="endInputId"
        type="datetime-local"
        [value]="value.end"
        [attr.min]="min || null"
        [attr.max]="max || null"
        [attr.aria-invalid]="showErrors ? 'true' : null"
        [disabled]="disabled"
        (input)="handleInput('end', $event)"
        (blur)="markTouched()"
        class="mt-1 block min-h-11 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-950 shadow-sm outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-100 disabled:cursor-not-allowed disabled:text-slate-500"
      />
    </div>
  </div>

  <app-validation-message [errors]="ngControl?.control?.errors" [show]="showErrors" />
</fieldset>
