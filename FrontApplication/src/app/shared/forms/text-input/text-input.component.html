    <label [attr.for]="inputId" class="block text-sm font-medium text-slate-700">{{ label }}</label>
    <div
      class="mt-1 flex min-h-11 items-center gap-2 rounded-md border border-slate-300 bg-white px-3 shadow-sm transition focus-within:border-teal-600 focus-within:ring-2 focus-within:ring-teal-100"
    >
      @if (prefixIcon) {
        <svg [lucideIcon]="prefixIcon" class="size-4 shrink-0 text-slate-500" aria-hidden="true"></svg>
      }
      <input
        [id]="inputId"
        [type]="type"
        [value]="value"
        [attr.placeholder]="placeholder || null"
        [attr.autocomplete]="autocomplete || null"
        [attr.maxlength]="maxLength ?? null"
        [disabled]="disabled"
        (input)="handleInput($event)"
        (blur)="markTouched()"
        class="min-w-0 flex-1 border-0 bg-transparent py-2 text-sm text-slate-950 outline-none placeholder:text-slate-400 disabled:cursor-not-allowed disabled:text-slate-500"
      />
      @if (suffixIcon) {
        <svg [lucideIcon]="suffixIcon" class="size-4 shrink-0 text-slate-500" aria-hidden="true"></svg>
      }
    </div>
    <app-validation-message [errors]="ngControl?.control?.errors" [show]="showErrors" />
