<label [for]="inputId" class="block">
  <span class="text-sm font-medium text-slate-700">{{ label | text }}</span>
  <span
    class="mt-1 flex min-h-11 items-center gap-2 rounded-md border border-slate-300 bg-white px-3 focus-within:border-teal-600 focus-within:ring-2 focus-within:ring-teal-100"
  >
    <svg lucideIcon="clock" class="size-4 shrink-0 text-slate-500" aria-hidden="true"></svg>
    <input
      [id]="inputId"
      type="text"
      role="combobox"
      autocomplete="off"
      [attr.list]="listId"
      [attr.aria-autocomplete]="'list'"
      [placeholder]="placeholder | text"
      [value]="value"
      [disabled]="disabled"
      class="min-w-0 flex-1 bg-transparent text-sm text-slate-900 outline-none placeholder:text-slate-400 disabled:cursor-not-allowed disabled:opacity-60"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
    />
  </span>
</label>

<datalist [id]="listId">
  @for (option of options; track option.id) {
    <option [value]="option.id" [label]="option.label"></option>
  }
</datalist>
