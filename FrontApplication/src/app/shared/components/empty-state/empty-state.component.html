    <section class="rounded-md border border-dashed border-slate-300 bg-slate-50 px-4 py-8 text-center">
      @if (icon) {
        <svg [lucideIcon]="icon" class="mx-auto size-8 text-slate-500" aria-hidden="true"></svg>
      }
      <h2 class="mt-3 text-base font-semibold text-slate-900">{{ title }}</h2>
      @if (message) {
        <p class="mx-auto mt-2 max-w-xl text-sm leading-6 text-slate-600">{{ message }}</p>
      }
      <div class="mt-4">
        <ng-content />
      </div>
    </section>
