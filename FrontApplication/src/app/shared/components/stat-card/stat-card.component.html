    <article class="rounded-md border border-slate-200 bg-white p-4 shadow-sm">
      <div class="flex items-center justify-between gap-3">
        <p class="text-sm font-medium text-slate-600">{{ label }}</p>
        @if (icon) {
          <svg [lucideIcon]="icon" class="size-5 text-teal-700" aria-hidden="true"></svg>
        }
      </div>
      <p class="mt-3 text-2xl font-semibold text-slate-950">{{ value }}</p>
      @if (hint) {
        <p class="mt-1 text-sm text-slate-500">{{ hint }}</p>
      }
    </article>
