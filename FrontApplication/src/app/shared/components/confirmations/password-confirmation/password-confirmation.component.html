<app-confirmation-dialog
  [open]="open"
  [title]="title"
  [message]="message"
  [confirmLabel]="confirmLabel"
  [cancelLabel]="cancelLabel"
  [icon]="icon"
  [destructive]="destructive"
  [confirmDisabled]="!hasPassword"
  [confirmAction]="runConfirmAction"
  [onSuccess]="onSuccess"
  [onCancel]="onCancel"
  [onFailure]="onFailure"
  (openChange)="handleOpenChange($event)"
  (cancelled)="cancelled.emit()"
  (confirmed)="confirmed.emit()"
  (failed)="failed.emit($event)"
>
  <label [attr.for]="passwordInputId" class="block text-sm font-medium text-slate-700">{{ passwordLabel | text }}</label>
  <input
    [id]="passwordInputId"
    type="password"
    class="mt-1 min-h-11 w-full rounded-md border border-slate-300 bg-white px-3 text-sm text-slate-950 shadow-sm outline-none placeholder:text-slate-400 focus:border-teal-600 focus:ring-2 focus:ring-teal-100"
    [value]="password"
    [attr.autocomplete]="autocomplete || null"
    (input)="handleInput($event)"
  />
</app-confirmation-dialog>
