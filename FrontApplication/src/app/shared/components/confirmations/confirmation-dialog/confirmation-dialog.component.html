@if (open) {
  <div
    animate.enter="cq-fade-in"
    animate.leave="cq-fade-out"
    class="fixed inset-0 z-50 grid place-items-center bg-slate-950/70 p-4"
    (click)="cancel()"
  >
    <section
      animate.enter="cq-dialog-enter"
      animate.leave="cq-dialog-leave"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="message ? messageId : null"
      class="w-full max-w-md rounded-md border border-slate-200 bg-white p-5 shadow-2xl will-change-[opacity,transform]"
      (click)="$event.stopPropagation()"
    >
      <div class="flex gap-4">
        <div
          class="grid size-11 shrink-0 place-items-center rounded-md"
          [ngClass]="destructive ? 'bg-red-50 text-red-700' : 'bg-teal-50 text-teal-700'"
        >
          <svg [lucideIcon]="icon" class="size-5" aria-hidden="true"></svg>
        </div>

        <div class="min-w-0 flex-1">
          <h2 [id]="titleId" class="text-base font-semibold text-slate-950">{{ title | text }}</h2>
          @if (message) {
            <p [id]="messageId" class="mt-2 text-sm leading-6 text-slate-600">
              {{ message | text }}
            </p>
          }

          <div class="mt-4">
            <ng-content />
          </div>

          @if (failureMessage) {
            <p
              class="mt-3 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
            >
              {{ failureMessage }}
            </p>
          }
        </div>
      </div>

      <div class="mt-5 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
        <button
          type="button"
          class="inline-flex min-h-10 items-center justify-center rounded-md border border-slate-200 bg-white px-4 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-60"
          [disabled]="processing"
          (click)="cancel()"
        >
          {{ cancelLabel | text }}
        </button>
        @if (showConfirm) {
          <button
            type="button"
            class="inline-flex min-h-10 items-center justify-center gap-2 rounded-md px-4 text-sm font-semibold text-white shadow-sm transition focus:ring-2 disabled:cursor-not-allowed disabled:opacity-60"
            [ngClass]="
              destructive
                ? 'bg-red-600 hover:bg-red-700 focus:ring-red-600'
                : 'bg-teal-700 hover:bg-teal-800 focus:ring-teal-600'
            "
            [disabled]="processing || confirmDisabled"
            (click)="confirm()"
          >
            @if (processing) {
              <svg lucideIcon="refresh-cw" class="size-4 animate-spin" aria-hidden="true"></svg>
            }
            {{ confirmLabel | text }}
          </button>
        }
      </div>
    </section>
  </div>
}
