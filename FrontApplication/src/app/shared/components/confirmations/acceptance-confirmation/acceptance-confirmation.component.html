<app-confirmation-dialog
  [open]="open"
  [title]="title"
  [message]="message"
  [confirmLabel]="confirmLabel"
  [cancelLabel]="cancelLabel"
  [icon]="icon"
  [destructive]="destructive"
  [confirmDisabled]="!accepted"
  [confirmAction]="confirmAction"
  [onSuccess]="onSuccess"
  [onCancel]="onCancel"
  [onFailure]="onFailure"
  (openChange)="handleOpenChange($event)"
  (cancelled)="cancelled.emit()"
  (confirmed)="confirmed.emit()"
  (failed)="failed.emit($event)"
>
  <label class="flex items-start gap-3 rounded-md border border-slate-200 bg-slate-50 p-3 text-sm text-slate-700">
    <input
      [id]="acceptInputId"
      type="checkbox"
      class="mt-1 size-4 rounded border-slate-300 text-teal-700 focus:ring-teal-600"
      [checked]="accepted"
      (change)="handleAccepted($event)"
    />
    <span>{{ acceptLabel | text }}</span>
  </label>
</app-confirmation-dialog>
