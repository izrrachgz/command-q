    <div class="min-h-screen bg-slate-100 text-slate-950">
      <aside
        class="fixed inset-y-0 left-0 z-30 w-64 border-r border-slate-200 bg-white transition-transform lg:translate-x-0"
        [ngClass]="mobileNavOpen ? 'translate-x-0' : '-translate-x-full'"
      >
        <div class="flex h-16 items-center justify-between border-b border-slate-200 px-4">
          <a routerLink="/" class="flex items-center gap-2 text-base font-semibold text-slate-950">
            <app-brand-mark size="lg" />
            {{ 'app.brand' | text }}
          </a>
          <button
            type="button"
            class="grid size-9 place-items-center rounded-md text-slate-600 hover:bg-slate-100 lg:hidden"
            aria-label="Close navigation"
            title="Close navigation"
            (click)="mobileNavOpen = false"
          >
            <svg lucideIcon="panel-left-close" class="size-5" aria-hidden="true"></svg>
          </button>
        </div>

        <nav class="space-y-1 px-3 py-4" [attr.aria-label]="areaLabel">
          @for (item of navigation; track item.route.join('/')) {
            <a
              [routerLink]="item.route"
              routerLinkActive="bg-teal-50 text-teal-800"
              [routerLinkActiveOptions]="{ exact: false }"
              class="flex min-h-11 items-center gap-3 rounded-md px-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100 hover:text-slate-950"
              (click)="mobileNavOpen = false"
            >
              <svg [lucideIcon]="item.icon" class="size-5 shrink-0" aria-hidden="true"></svg>
              <span>{{ item.labelKey | text }}</span>
            </a>
          }
        </nav>
      </aside>

      @if (mobileNavOpen) {
        <button
          type="button"
          class="fixed inset-0 z-20 bg-slate-950/30 lg:hidden"
          aria-label="Close navigation"
          (click)="mobileNavOpen = false"
        ></button>
      }

      <div class="lg:pl-64">
        <header class="sticky top-0 z-10 flex h-16 items-center justify-between border-b border-slate-200 bg-white/95 px-4 backdrop-blur">
          <div class="flex items-center gap-3">
            <button
              type="button"
              class="grid size-9 place-items-center rounded-md text-slate-600 hover:bg-slate-100 lg:hidden"
              aria-label="Open navigation"
              title="Open navigation"
              (click)="mobileNavOpen = true"
            >
              <svg lucideIcon="menu" class="size-5" aria-hidden="true"></svg>
            </button>
            <p class="text-sm font-medium uppercase tracking-wide text-slate-500">{{ areaLabel }}</p>
          </div>

          <div class="flex items-center gap-2">
            <label class="sr-only" for="culture">{{ 'app.language' | text }}</label>
            <div class="flex min-h-10 items-center gap-2 rounded-md border border-slate-200 bg-slate-50 px-3">
              <svg lucideIcon="languages" class="size-4 text-slate-500" aria-hidden="true"></svg>
              <select
                id="culture"
                class="bg-transparent text-sm font-medium text-slate-700 outline-none"
                [value]="i18n.currentCulture"
                (change)="changeCulture($event)"
              >
                @for (culture of i18n.supportedCultures; track culture) {
                  <option [value]="culture">{{ culture }}</option>
                }
              </select>
            </div>

            <button
              type="button"
              class="inline-flex min-h-10 items-center gap-2 rounded-md border border-slate-200 bg-white px-3 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-60"
              (click)="auth.logout()"
            >
              <svg lucideIcon="log-out" class="size-4" aria-hidden="true"></svg>
              {{ 'action.logout' | text }}
            </button>
          </div>
        </header>

        <main class="mx-auto w-full max-w-7xl px-4 py-6 md:px-6 lg:px-8">
          <router-outlet />
        </main>
      </div>
    </div>
