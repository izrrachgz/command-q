<div class="min-h-screen flex items-center justify-center">
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md space-y-6"
  >
    <h2 class="text-2xl font-bold text-center text-purple-700">Create Account</h2>

    <!-- USERNAME -->
    <div>
      <input
        type="text"
        placeholder="Username"
        formControlName="username"
        class="w-full px-4 py-2 border border-purple-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none"
      />
    </div>

    <!-- EMAIL -->
    <div>
      <input
        type="email"
        placeholder="Email"
        formControlName="email"
        class="w-full px-4 py-2 border border-purple-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none"
      />
    </div>

    <!-- PASSWORD -->
    <div class="space-y-2">
      <div class="relative">
        <input
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Password"
          formControlName="password"
          (input)="checkPassword()"
          class="w-full px-4 py-2 border border-purple-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none"
        />

        <button
          type="button"
          (click)="showPassword = !showPassword"
          class="absolute right-3 top-2 text-gray-500 text-sm"
        >
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>

      <!-- PASSWORD STRENGTH BAR -->
      <div class="h-2 bg-gray-200 rounded">
        <div
          class="h-2 rounded transition-all"
          [ngClass]="strengthColor"
          [style.width.%]="passwordStrength"
        ></div>
      </div>

      <!-- PASSWORD RULES -->
      <ul class="text-xs space-y-1">
        <li [class.text-green-600]="rules.lowercase">✓ lowercase letter</li>

        <li [class.text-green-600]="rules.uppercase">✓ uppercase letter</li>

        <li [class.text-green-600]="rules.number">✓ number</li>

        <li [class.text-green-600]="rules.symbol">✓ symbol</li>

        <li [class.text-green-600]="rules.length">✓ at least 8 characters</li>
      </ul>
    </div>

    <!-- CONFIRM PASSWORD -->
    <div>
      <input
        type="password"
        placeholder="Confirm Password"
        formControlName="confirmPassword"
        class="w-full px-4 py-2 border border-purple-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none"
      />

      @if (
        form.errors != null &&
        form.errors['passwordMismatch'] != null &&
        form.controls['confirmPassword'].touched
      ) {
        <p class="text-red-500 text-sm mt-1">Passwords do not match</p>
      }
    </div>

    <!-- SUBMIT -->
    <button
      type="submit"
      [disabled]="form.invalid"
      class="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 transition disabled:opacity-50"
    >
      Register
    </button>

    <p class="text-center text-sm text-gray-500">
      Already have an account?
      <a routerLink="/login" class="text-purple-600 hover:underline"> Login </a>
    </p>
  </form>
</div>
