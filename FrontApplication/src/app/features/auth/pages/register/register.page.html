    <main class="grid min-h-screen place-items-center bg-slate-100 px-4 py-10">
      <section class="w-full max-w-md rounded-md border border-slate-200 bg-white p-6 shadow-sm">
        <a routerLink="/" class="mb-6 inline-flex items-center gap-2 text-sm font-semibold text-slate-800">
          <app-brand-mark />
          {{ 'app.brand' | text }}
        </a>

        <h1 class="text-2xl font-semibold text-slate-950">{{ 'auth.register' | text }}</h1>

        <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
          <app-text-input
            formControlName="username"
            prefixIcon="user"
            autocomplete="username"
            [label]="'auth.username' | text"
            [maxLength]="255"
          />
          <app-text-input
            formControlName="email"
            type="email"
            prefixIcon="mail"
            autocomplete="email"
            [label]="'auth.email' | text"
            [maxLength]="255"
          />
          <app-password-input
            formControlName="password"
            autocomplete="new-password"
            [label]="'field.password' | text"
          />
          <app-password-input
            formControlName="confirmPassword"
            autocomplete="new-password"
            [label]="'field.confirmPassword' | text"
          />

          @if (error) {
            <p class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ error | text }}</p>
          }

          <button
            type="submit"
            [disabled]="loading || form.invalid"
            class="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-md bg-teal-700 px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-teal-800 disabled:cursor-not-allowed disabled:opacity-60"
          >
            @if (loading) {
              <svg lucideIcon="refresh-cw" class="size-4 animate-spin" aria-hidden="true"></svg>
            } @else {
              <svg lucideIcon="user-plus" class="size-4" aria-hidden="true"></svg>
            }
            {{ 'action.create' | text }}
          </button>
        </form>
      </section>
    </main>
