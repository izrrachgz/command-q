<main class="grid min-h-screen place-items-center bg-slate-100 px-4 py-10">
  <section class="w-full max-w-md rounded-md border border-slate-200 bg-white p-6 text-center shadow-sm">
    <a routerLink="/" class="mx-auto mb-6 inline-flex items-center gap-2 text-sm font-semibold text-slate-800">
      <app-brand-mark />
      {{ 'app.brand' | text }}
    </a>

    <svg lucideIcon="lock-keyhole" class="mx-auto size-8 text-teal-700" aria-hidden="true"></svg>
    <h1 class="mt-4 text-2xl font-semibold text-slate-950">
      {{ loginTitleKey | text }}
    </h1>
    <p class="mt-2 text-sm leading-6 text-slate-600">{{ 'auth.loginIntro' | text }}</p>

    @if (error) {
      <p class="mt-5 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-left text-sm text-red-700">
        {{ error | text }}
      </p>
    }

    <button
      type="button"
      [disabled]="loading"
      class="mt-6 inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-md bg-teal-700 px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-teal-800 disabled:cursor-not-allowed disabled:opacity-60"
      (click)="startLogin()"
    >
      @if (loading) {
        <svg lucideIcon="refresh-cw" class="size-4 animate-spin" aria-hidden="true"></svg>
      } @else {
        <svg lucideIcon="lock-keyhole" class="size-4" aria-hidden="true"></svg>
      }
      {{ (loading ? 'app.loading' : 'action.login') | text }}
    </button>

    <p class="mt-3 text-xs leading-5 text-slate-500">{{ 'auth.externalUnavailable' | text }}</p>
  </section>
</main>
