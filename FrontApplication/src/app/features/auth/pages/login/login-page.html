<div class="min-h-screen flex items-center justify-center">
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm space-y-6"
  >
    <h2 class="text-2xl font-bold text-center text-purple-700">Login</h2>

    <div>
      <input
        type="text"
        placeholder="Username"
        formControlName="username"
        maxlength="255"
        class="w-full px-4 py-2 border border-purple-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
      />
    </div>

    <div>
      <input
        type="password"
        placeholder="Password"
        formControlName="password"
        maxlength="255"
        class="w-full px-4 py-2 border border-purple-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
      />
    </div>

    <button
      type="submit"
      [disabled]="loading"
      class="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Login
    </button>

    <p class="text-center text-sm text-gray-500">
      Don't have an account?
      <a routerLink="/auth/register" class="text-purple-600 hover:underline"> Register </a>
    </p>
  </form>
</div>
