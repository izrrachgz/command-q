    <app-page-header [eyebrow]="'nav.tenant' | text" [title]="'preferences.title' | text" />

    @if (preferences.preferences$ | async; as prefs) {
      <section class="max-w-2xl rounded-md border border-slate-200 bg-white p-5 shadow-sm">
        <div class="grid gap-5">
          <label class="block">
            <span class="text-sm font-medium text-slate-700">{{ 'field.language' | text }}</span>
            <select
              class="mt-1 min-h-11 w-full rounded-md border border-slate-300 bg-white px-3 text-sm outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-100"
              [ngModel]="prefs.culture"
              (ngModelChange)="setCulture($event)"
            >
              @for (culture of i18n.supportedCultures; track culture) {
                <option [value]="culture">{{ culture }}</option>
              }
            </select>
          </label>

          <label class="flex items-center justify-between gap-4 rounded-md border border-slate-200 p-3 text-sm">
            <span class="font-medium text-slate-700">{{ 'field.darkTheme' | text }}</span>
            <input
              type="checkbox"
              class="size-4 rounded border-slate-300 text-red-600 focus:ring-red-600"
              [ngModel]="prefs.theme === themes.dark"
              (ngModelChange)="setTheme($event)"
            />
          </label>

          <label class="flex items-center justify-between gap-4 rounded-md border border-slate-200 p-3 text-sm">
            <span class="font-medium text-slate-700">{{ 'field.compactNavigation' | text }}</span>
            <input
              type="checkbox"
              class="size-4 rounded border-slate-300 text-teal-700 focus:ring-teal-600"
              [ngModel]="prefs.compactNavigation"
              (ngModelChange)="preferences.update({ compactNavigation: $event })"
            />
          </label>

          <label class="flex items-center justify-between gap-4 rounded-md border border-slate-200 p-3 text-sm">
            <span class="font-medium text-slate-700">{{ 'field.reduceMotion' | text }}</span>
            <input
              type="checkbox"
              class="size-4 rounded border-slate-300 text-teal-700 focus:ring-teal-600"
              [ngModel]="prefs.reduceMotion"
              (ngModelChange)="preferences.update({ reduceMotion: $event })"
            />
          </label>

          <label class="flex items-center justify-between gap-4 rounded-md border border-slate-200 p-3 text-sm">
            <span class="font-medium text-slate-700">{{ 'field.enhancedFocus' | text }}</span>
            <input
              type="checkbox"
              class="size-4 rounded border-slate-300 text-teal-700 focus:ring-teal-600"
              [ngModel]="prefs.enhancedFocus"
              (ngModelChange)="preferences.update({ enhancedFocus: $event })"
            />
          </label>

          <label class="flex items-center justify-between gap-4 rounded-md border border-slate-200 p-3 text-sm">
            <span class="font-medium text-slate-700">{{ 'field.showDenseTables' | text }}</span>
            <input
              type="checkbox"
              class="size-4 rounded border-slate-300 text-teal-700 focus:ring-teal-600"
              [ngModel]="prefs.showDenseTables"
              (ngModelChange)="preferences.update({ showDenseTables: $event })"
            />
          </label>
        </div>
      </section>
    }
