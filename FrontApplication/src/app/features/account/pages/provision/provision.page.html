    <section class="mx-auto max-w-xl rounded-md border border-slate-200 bg-white p-6 shadow-sm">
      <div class="flex items-start gap-4">
        <span class="grid size-11 shrink-0 place-items-center rounded-md bg-teal-50 text-teal-700">
          @if (loading) {
            <svg lucideIcon="refresh-cw" class="size-5 animate-spin" aria-hidden="true"></svg>
          } @else {
            <svg lucideIcon="circle-alert" class="size-5" aria-hidden="true"></svg>
          }
        </span>
        <div>
          <h1 class="text-xl font-semibold text-slate-950">{{ 'provision.title' | text }}</h1>
          <p class="mt-2 text-sm leading-6 text-slate-600">
            {{ (failed ? 'provision.failed' : 'provision.copy') | text }}
          </p>
          @if (failed) {
            <button
              type="button"
              [disabled]="loading"
              class="mt-4 inline-flex min-h-10 items-center gap-2 rounded-md bg-teal-700 px-4 text-sm font-semibold text-white hover:bg-teal-800 disabled:cursor-not-allowed disabled:opacity-60"
              (click)="provision()"
            >
              <svg lucideIcon="refresh-cw" class="size-4" aria-hidden="true"></svg>
              {{ 'action.retry' | text }}
            </button>
          }
        </div>
      </div>
    </section>
