    <main class="relative min-h-screen overflow-hidden bg-slate-950 text-white">
      <img
        src="/assets/commandq-landing.png"
        alt=""
        class="absolute inset-0 h-full w-full object-cover"
        fetchpriority="high"
      />
      <div class="absolute inset-0 bg-slate-950/55"></div>

      <section class="relative flex min-h-screen items-center px-5 py-10">
        <div class="mx-auto grid w-full max-w-7xl gap-10 lg:grid-cols-[minmax(0,0.9fr)_minmax(360px,440px)] lg:items-center">
          <div class="max-w-2xl">
            <div class="inline-flex items-center gap-2 rounded-md border border-white/20 bg-white/10 px-3 py-2 text-sm font-medium backdrop-blur">
              <app-brand-mark size="sm" />
              {{ 'app.brand' | text }}
            </div>
            <h1 class="mt-6 text-5xl font-semibold tracking-normal text-white md:text-7xl">
              {{ 'landing.title' | text }}
            </h1>
            <p class="mt-5 max-w-xl text-lg leading-8 text-slate-100">
              {{ 'landing.copy' | text }}
            </p>
          </div>

          <div class="rounded-md border border-white/20 bg-white/95 p-5 text-slate-950 shadow-2xl backdrop-blur">
            <div class="space-y-3">
              <a
                [routerLink]="links.tenantLogin"
                [queryParams]="queryParams.tenant"
                class="flex min-h-20 items-center gap-4 rounded-md border border-slate-200 bg-white p-4 text-left transition hover:border-teal-500 hover:bg-teal-50"
              >
                <span class="grid size-11 place-items-center rounded-md bg-teal-700 text-white">
                  <svg lucideIcon="house" class="size-5" aria-hidden="true"></svg>
                </span>
                <span>
                  <span class="block text-base font-semibold">{{ 'landing.tenant' | text }}</span>
                  <span class="mt-1 block text-sm leading-6 text-slate-600">{{ 'landing.tenantCopy' | text }}</span>
                </span>
              </a>

              <a
                [routerLink]="links.adminLogin"
                [queryParams]="queryParams.admin"
                class="flex min-h-20 items-center gap-4 rounded-md border border-slate-200 bg-white p-4 text-left transition hover:border-amber-500 hover:bg-amber-50"
              >
                <span class="grid size-11 place-items-center rounded-md bg-amber-600 text-white">
                  <svg lucideIcon="users-round" class="size-5" aria-hidden="true"></svg>
                </span>
                <span>
                  <span class="block text-base font-semibold">{{ 'landing.admin' | text }}</span>
                  <span class="mt-1 block text-sm leading-6 text-slate-600">{{ 'landing.adminCopy' | text }}</span>
                </span>
              </a>
            </div>

            <a
              [routerLink]="links.register"
              class="mt-4 inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-md border border-slate-300 bg-white px-4 text-sm font-semibold text-slate-800 shadow-sm transition hover:bg-slate-50"
            >
              <svg lucideIcon="user-plus" class="size-4" aria-hidden="true"></svg>
              {{ 'landing.register' | text }}
            </a>
          </div>
        </div>
      </section>
    </main>
