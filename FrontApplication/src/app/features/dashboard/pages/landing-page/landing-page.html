<div class="min-h-screen bg-[#0f0f0f] text-zinc-100 p-6">
  <h1 class="text-2xl font-semibold mb-6">Dashboard</h1>

  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5">
    <!-- CARD -->
    <div
      class="group bg-[#171717] rounded-2xl p-5 flex flex-col items-center justify-center shadow-lg hover:shadow-purple-500/20 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fadeIn"
      style="animation-duration: 2s"
    >
      <!-- ICON -->
      <svg
        class="w-10 h-10 mb-3 text-purple-500 group-hover:scale-110 transition"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path d="M12 4v16m8-8H4" />
      </svg>

      <h2 class="text-sm font-medium">Invite User</h2>
    </div>

    <!-- GROUPS -->
    <div
      class="group bg-[#171717] rounded-2xl p-5 flex flex-col items-center justify-center shadow-lg hover:shadow-purple-500/20 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fadeIn"
      style="animation-duration: 2s"
    >
      <svg
        class="w-10 h-10 mb-3 text-purple-500 group-hover:scale-110 transition"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path
          d="M17 20h5v-2a4 4 0 00-5-3.87M9 20H4v-2a4 4 0 015-3.87M16 7a4 4 0 11-8 0 4 4 0 018 0z"
        />
      </svg>

      <h2 class="text-sm font-medium">Groups</h2>
    </div>

    <!-- MAP -->
    <div
      class="group bg-[#171717] rounded-2xl p-5 flex flex-col items-center justify-center shadow-lg hover:shadow-purple-500/20 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fadeIn"
      style="animation-duration: 2s"
    >
      <svg
        class="w-10 h-10 mb-3 text-purple-500 group-hover:scale-110 transition"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path d="M9 20l-5-2V6l5 2m0 12l6-2m-6 2V8m6 10l5 2V6l-5-2m0 14V4" />
      </svg>

      <h2 class="text-sm font-medium">Map</h2>
    </div>

    <!-- SETTINGS -->
    <div
      class="group bg-[#171717] rounded-2xl p-5 flex flex-col items-center justify-center shadow-lg hover:shadow-purple-500/20 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fadeIn"
      style="animation-duration: 2s"
    >
      <svg
        class="w-10 h-10 mb-3 text-purple-500 group-hover:scale-110 transition"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path
          d="M12 8a4 4 0 100 8 4 4 0 000-8zm0-6v2m0 16v2m8-10h2M2 12H0m15.5-6.5l1.5-1.5M6.5 17.5l-1.5 1.5m0-13l1.5 1.5M17.5 17.5l1.5 1.5"
        />
      </svg>

      <h2 class="text-sm font-medium">Settings</h2>
    </div>

    <!-- PANIC BUTTON -->
    <div
      class="group bg-red-600/90 rounded-2xl p-5 flex flex-col items-center justify-center shadow-lg hover:shadow-red-500/40 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fadeIn"
      style="animation-duration: 2s"
    >
      <svg
        class="w-10 h-10 mb-3 text-white group-hover:scale-110 transition"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path
          d="M12 9v4m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4c-.77-1.33-2.69-1.33-3.46 0L3.34 16c-.77 1.33.19 3 1.73 3z"
        />

      <h2 class="text-sm font-semibold">Panic</h2>
    </div>
  </div>
