syntax = "proto3";

package command.emails.v1;

option csharp_namespace = "Email.Client.Grpc";

service EmailQueue {
  rpc Enqueue (EnqueueEmailRequest) returns (EnqueueEmailResponse);
  rpc GetPage (GetEmailPageRequest) returns (GetEmailPageResponse);
  rpc Search (SearchEmailPageRequest) returns (GetEmailPageResponse);
  rpc GetDetail (GetEmailDetailRequest) returns (QueuedEmailDetail);
}

message EmailAddressMessage {
  string address = 1;
  optional string name = 2;
}

message EmailBinaryContent {
  string file_name = 1;
  optional string content_type = 2;
  bytes content = 3;
  optional string content_id = 4;
}

message EmailMessageData {
  optional EmailAddressMessage from = 1;
  repeated EmailAddressMessage to = 2;
  repeated EmailAddressMessage cc = 3;
  repeated EmailAddressMessage bcc = 4;
  repeated EmailAddressMessage reply_to = 5;
  string subject = 6;
  optional string text_body = 7;
  optional string html_body = 8;
  repeated EmailBinaryContent attachments = 9;
  repeated EmailBinaryContent inline_resources = 10;
}

message EnqueueEmailRequest {
  EmailMessageData message = 1;
  optional string profile_name = 2;
  optional string idempotency_key = 3;
  optional string account_reference = 4;
  optional string correlation_id = 5;
}

message EnqueueEmailResponse {
  string id = 1;
  bool was_duplicate = 2;
  string created_utc = 3;
}

enum EmailQueueStatus {
  EMAIL_QUEUE_STATUS_UNSPECIFIED = 0;
  EMAIL_QUEUE_STATUS_PENDING = 1;
  EMAIL_QUEUE_STATUS_PROCESSING = 2;
  EMAIL_QUEUE_STATUS_SENT = 3;
  EMAIL_QUEUE_STATUS_DEAD_LETTER = 4;
}

message GetEmailPageRequest {
  string account_reference = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message SearchEmailPageRequest {
  optional string account_reference = 1;
  int32 page = 2;
  int32 page_size = 3;
  optional string search_term = 4;
  optional string recipient = 5;
  optional EmailQueueStatus status = 6;
  optional string start_utc = 7;
  optional string end_utc = 8;
}

message QueuedEmailSummary {
  string id = 1;
  string subject = 2;
  repeated string recipients = 3;
  optional string account_reference = 4;
  EmailQueueStatus status = 5;
  int32 attempt_count = 6;
  string created_utc = 7;
  string modified_utc = 8;
  optional string sent_utc = 9;
  optional string dead_letter_utc = 10;
  optional string last_failure_kind = 11;
  optional string message_id = 12;
}

message GetEmailDetailRequest {
  string id = 1;
}

message EmailBinaryMetadata {
  string file_name = 1;
  optional string content_type = 2;
  int64 size = 3;
  optional string content_id = 4;
}

message EmailMessageDetailData {
  optional EmailAddressMessage from = 1;
  repeated EmailAddressMessage to = 2;
  repeated EmailAddressMessage cc = 3;
  repeated EmailAddressMessage bcc = 4;
  repeated EmailAddressMessage reply_to = 5;
  string subject = 6;
  optional string text_body = 7;
  optional string html_body = 8;
  repeated EmailBinaryMetadata attachments = 9;
  repeated EmailBinaryMetadata inline_resources = 10;
}

message QueuedEmailDetail {
  reserved 15;
  string id = 1;
  EmailMessageDetailData message = 2;
  string profile_name = 3;
  optional string idempotency_key = 4;
  optional string account_reference = 5;
  optional string correlation_id = 6;
  EmailQueueStatus status = 7;
  int32 attempt_count = 8;
  string created_utc = 9;
  string modified_utc = 10;
  string next_attempt_utc = 11;
  optional string sent_utc = 12;
  optional string dead_letter_utc = 13;
  optional string last_failure_kind = 14;
  optional string message_id = 16;
}

message GetEmailPageResponse {
  repeated QueuedEmailSummary items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total_count = 4;
  int64 total_pages = 5;
}
