<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">command-q end-to-end system composition</title>
  <desc id="desc">The browser frontend authenticates through IdentityServer and calls the command-q API. IdentityServer and the API queue mail through Email.Api, which persists to an outbox consumed by Email.Worker and delivered by SMTP. Jobs.Api and Jobs.Worker provide durable background job processing. Each service owns its database.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8ea1b8"/></marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#58d6ff"/></marker>
    <style>
      .lane{fill:#171a20;stroke:#2d3440;stroke-width:1}.box{fill:#22262e;stroke:#4a5565;stroke-width:2}.auth{stroke:#a98cff}.api{stroke:#58d6ff}.email{stroke:#e96a9a}.jobs{stroke:#5ee6a8}.data{fill:#1b2027;stroke:#778397;stroke-width:2}.title{font:700 29px 'Segoe UI',sans-serif;fill:#f4f7fb}.subtitle{font:14px 'Segoe UI',sans-serif;fill:#9aa7b7}.laneTitle{font:700 13px 'Segoe UI',sans-serif;fill:#778597;letter-spacing:1.4px}.boxTitle{font:700 17px 'Segoe UI',sans-serif;fill:#f4f7fb}.boxText{font:13px 'Segoe UI',sans-serif;fill:#aeb9c8}.label{font:12px 'Segoe UI',sans-serif;fill:#d1d9e4}.labelBg{fill:#101217;stroke:#343d4b;stroke-width:1}.flow{fill:none;stroke:#8ea1b8;stroke-width:2.2;marker-end:url(#arrow)}.primary{fill:none;stroke:#58d6ff;stroke-width:2.8;marker-end:url(#arrowCyan)}.dashed{stroke-dasharray:7 6}.dbLine{fill:none;stroke:#778397;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="940" rx="20" fill="#101217"/>
  <text x="44" y="52" class="title">command-q system composition</text>
  <text x="44" y="79" class="subtitle">From the browser through authentication and APIs to durable storage, workers, and delivery</text>

  <rect x="30" y="100" width="1340" height="130" rx="14" class="lane"/><text x="50" y="127" class="laneTitle">USER EXPERIENCE</text>
  <rect x="490" y="140" width="420" height="66" rx="12" class="box api"/>
  <text x="700" y="168" text-anchor="middle" class="boxTitle">command-q-front</text><text x="700" y="190" text-anchor="middle" class="boxText">Browser SPA • pages, interactions, OIDC client</text>
  <rect x="1150" y="145" width="190" height="56" rx="12" class="box jobs"/>
  <text x="1245" y="169" text-anchor="middle" class="boxTitle">Internal caller</text><text x="1245" y="190" text-anchor="middle" class="boxText">Scheduled work client</text>

  <rect x="30" y="250" width="1340" height="190" rx="14" class="lane"/><text x="50" y="277" class="laneTitle">SECURITY AND API ENTRY POINTS</text>
  <rect x="48" y="312" width="190" height="70" rx="12" class="box auth"/><text x="143" y="340" text-anchor="middle" class="boxTitle">External identity</text><text x="143" y="363" text-anchor="middle" class="boxText">Google / Microsoft</text>
  <rect x="285" y="300" width="260" height="94" rx="12" class="box auth"/><text x="415" y="329" text-anchor="middle" class="boxTitle">IdentityServer</text><text x="415" y="352" text-anchor="middle" class="boxText">Sign-in, account security</text><text x="415" y="373" text-anchor="middle" class="boxText">roles and token issuance</text>
  <rect x="590" y="300" width="210" height="94" rx="12" class="box email"/><text x="695" y="329" text-anchor="middle" class="boxTitle">Email.Api</text><text x="695" y="352" text-anchor="middle" class="boxText">Durable queue ingress</text><text x="695" y="373" text-anchor="middle" class="boxText">protobuf + JSON REST</text>
  <rect x="850" y="300" width="255" height="94" rx="12" class="box api"/><text x="978" y="329" text-anchor="middle" class="boxTitle">command-q API</text><text x="978" y="352" text-anchor="middle" class="boxText">Authenticated business API</text><text x="978" y="373" text-anchor="middle" class="boxText">authorization and notifications</text>
  <rect x="1150" y="300" width="190" height="94" rx="12" class="box jobs"/><text x="1245" y="329" text-anchor="middle" class="boxTitle">Jobs.Api</text><text x="1245" y="352" text-anchor="middle" class="boxText">Durable job ingress</text><text x="1245" y="373" text-anchor="middle" class="boxText">authenticated API</text>

  <rect x="30" y="460" width="1340" height="150" rx="14" class="lane"/><text x="50" y="487" class="laneTitle">APPLICATION AND BACKGROUND PROCESSING</text>
  <rect x="590" y="515" width="210" height="66" rx="12" class="box email"/><text x="695" y="543" text-anchor="middle" class="boxTitle">Email.Worker</text><text x="695" y="565" text-anchor="middle" class="boxText">Claims, retries, sends</text>
  <rect x="850" y="515" width="255" height="66" rx="12" class="box api"/><text x="978" y="543" text-anchor="middle" class="boxTitle">Application + Domain</text><text x="978" y="565" text-anchor="middle" class="boxText">Use cases and business rules</text>
  <rect x="1150" y="515" width="190" height="66" rx="12" class="box jobs"/><text x="1245" y="543" text-anchor="middle" class="boxTitle">Jobs.Worker</text><text x="1245" y="565" text-anchor="middle" class="boxText">Executes durable jobs</text>

  <rect x="30" y="630" width="1340" height="150" rx="14" class="lane"/><text x="50" y="657" class="laneTitle">SERVICE-OWNED DATA</text>
  <rect x="300" y="686" width="230" height="62" rx="31" class="data auth"/><text x="415" y="714" text-anchor="middle" class="boxTitle">Identity database</text><text x="415" y="735" text-anchor="middle" class="boxText">Users, clients, challenges</text>
  <rect x="580" y="686" width="230" height="62" rx="31" class="data email"/><text x="695" y="714" text-anchor="middle" class="boxTitle">Email outbox</text><text x="695" y="735" text-anchor="middle" class="boxText">Messages, leases, attempts</text>
  <rect x="863" y="686" width="230" height="62" rx="31" class="data api"/><text x="978" y="714" text-anchor="middle" class="boxTitle">Application database</text><text x="978" y="735" text-anchor="middle" class="boxText">Business records</text>
  <rect x="1130" y="686" width="230" height="62" rx="31" class="data jobs"/><text x="1245" y="714" text-anchor="middle" class="boxTitle">Jobs database</text><text x="1245" y="735" text-anchor="middle" class="boxText">Jobs, schedules, leases</text>

  <rect x="30" y="800" width="1340" height="100" rx="14" class="lane"/><text x="50" y="827" class="laneTitle">DELIVERY</text>
  <rect x="590" y="840" width="215" height="40" rx="10" class="box email"/><text x="698" y="866" text-anchor="middle" class="boxTitle">SMTP / smtp4dev</text>
  <rect x="850" y="840" width="215" height="40" rx="10" class="box"/><text x="958" y="866" text-anchor="middle" class="boxTitle">Recipient inbox</text>

  <path d="M620 206 C560 245 475 255 430 300" class="primary"/>
  <rect x="470" y="240" width="104" height="22" rx="6" class="labelBg"/><text x="522" y="255" text-anchor="middle" class="label">OIDC + PKCE</text>
  <path d="M780 206 C820 245 925 260 978 300" class="primary"/>
  <rect x="830" y="240" width="134" height="22" rx="6" class="labelBg"/><text x="897" y="255" text-anchor="middle" class="label">REST + bearer token</text>
  <path d="M1245 201 L1245 300" class="flow dashed"/>
  <rect x="1260" y="242" width="92" height="22" rx="6" class="labelBg"/><text x="1306" y="257" text-anchor="middle" class="label">job commands</text>
  <path d="M238 347 L285 347" class="flow"/>
  <rect x="241" y="315" width="42" height="20" rx="6" class="labelBg"/><text x="262" y="329" text-anchor="middle" class="label">login</text>
  <path d="M978 394 L978 515" class="primary"/>
  <path d="M545 347 L590 347" class="flow"/>
  <path d="M850 370 L800 370" class="flow"/>
  <path d="M415 394 L415 686" class="dbLine"/><path d="M978 581 L978 686" class="dbLine"/>
  <path d="M625 394 L560 394 L560 717 L580 717" class="dbLine"/><path d="M695 686 L695 581" class="dbLine"/>
  <path d="M1340 394 L1365 394 L1365 717 L1360 717" class="dbLine"/><path d="M1245 686 L1245 581" class="dbLine"/>
  <path d="M800 548 L825 548 L825 808 L805 850" class="flow"/>
  <rect x="778" y="785" width="94" height="22" rx="6" class="labelBg"/><text x="825" y="800" text-anchor="middle" class="label">SMTP delivery</text>
  <path d="M805 860 L850 860" class="flow"/>
  <g transform="translate(50 918)"><line x1="0" y1="-5" x2="40" y2="-5" class="primary"/><text x="52" y="0" class="label">primary browser flow</text><line x1="220" y1="-5" x2="260" y2="-5" class="flow"/><text x="272" y="0" class="label">service, persistence or delivery flow</text><line x1="505" y1="-5" x2="545" y2="-5" class="flow dashed"/><text x="557" y="0" class="label">independent internal caller</text></g>
</svg>
